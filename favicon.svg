<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MONO // GLYPH ASCII icon">
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#070708" stroke="#3f3f46" stroke-width="2" />
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" dominant-baseline="central">
    <!-- Top ASCII frame row -->
    <text x="15" y="16" font-size="16" font-weight="500" fill="#71717a">+</text>
    <text x="32" y="16" font-size="16" font-weight="500" fill="#71717a">-</text>
    <text x="49" y="16" font-size="16" font-weight="500" fill="#71717a">+</text>

    <!-- Middle ASCII glyph row -->
    <text x="15" y="32" font-size="16" font-weight="500" fill="#a1a1aa">|</text>
    <text x="32" y="33" font-size="22" font-weight="700" fill="#ffffff">#</text>
    <text x="49" y="32" font-size="16" font-weight="500" fill="#a1a1aa">|</text>

    <!-- Bottom ASCII frame row -->
    <text x="15" y="48" font-size="16" font-weight="500" fill="#71717a">+</text>
    <text x="32" y="48" font-size="16" font-weight="500" fill="#71717a">-</text>
    <text x="49" y="48" font-size="16" font-weight="500" fill="#71717a">+</text>
  </g>
</svg>
