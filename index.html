  <script>
    /**
     * MONO // GLYPH — 19 Procedural ASCII & Character-Streaming Effects
     * All effects render directly into <pre> character buffers at controlled FPS.
     */

    // =========================================================================
    // UTILITY HELPERS
    // =========================================================================

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Converts a plain ASCII buffer into 3-tier monochrome shaded HTML
     * (bright highlights, mid-tone structure, dim atmospheric trails),
     * batching adjacent characters of the same luminance tier for speed.
     */
    const HI_CHARS = new Set('@#$%█▓O><^vABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789');
    const LO_CHARS = new Set('.·:-~░_,');

    function shadeAscii(text) {
      let html = '';
      let currentCls = '';
      let chunk = '';

      const flush = () => {
        if (!chunk) return;
        const safe = escapeHtml(chunk);
        html += currentCls ? `<span class="${currentCls}">${safe}</span>` : safe;
        chunk = '';
      };

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '\n' || ch === ' ') {
          flush();
          currentCls = '';
          html += ch;
          continue;
        }
        const cls = HI_CHARS.has(ch) ? 'c-hi' : LO_CHARS.has(ch) ? 'c-lo' : 'c-md';
        if (cls !== currentCls) {
          flush();
          currentCls = cls;
        }
        chunk += ch;
      }
      flush();
      return html;
    }

    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.style.opacity = '1';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
      }, 1800);
    }

    function copyTextToClipboard(text) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        textarea.style.pointerEvents = 'none';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('Copied algorithm to clipboard');
      } catch (err) {
        showToast('Unable to copy');
      }
    }

    // =========================================================================
    // COMPACT 3x5 BITMAP FONT FOR LIVE NAME STREAMER
    // =========================================================================

    const FONT_3X5 = {
      A: ['010', '101', '111', '101', '101'],
      B: ['110', '101', '110', '101', '110'],
      C: ['011', '100', '100', '100', '011'],
      D: ['110', '101', '101', '101', '110'],
      E: ['111', '100', '110', '100', '111'],
      F: ['111', '100', '110', '100', '100'],
      G: ['011', '100', '101', '101', '011'],
      H: ['101', '101', '111', '101', '101'],
      I: ['111', '010', '010', '010', '111'],
      J: ['001', '001', '001', '101', '010'],
      K: ['101', '101', '110', '101', '101'],
      L: ['100', '100', '100', '100', '111'],
      M: ['101', '111', '111', '101', '101'],
      N: ['111', '101', '101', '101', '101'],
      O: ['010', '101', '101', '101', '010'],
      P: ['110', '101', '110', '100', '100'],
      Q: ['010', '101', '101', '111', '011'],
      R: ['110', '101', '110', '101', '101'],
      S: ['011', '100', '010', '001', '110'],
      T: ['111', '010', '010', '010', '010'],
      U: ['101', '101', '101', '101', '111'],
      V: ['101', '101', '101', '101', '010'],
      W: ['101', '101', '111', '111', '101'],
      X: ['101', '101', '010', '101', '101'],
      Y: ['101', '101', '010', '010', '010'],
      Z: ['111', '001', '010', '100', '111'],
      '0': ['111', '101', '101', '101', '111'],
      '1': ['010', '110', '010', '010', '111'],
      '2': ['110', '001', '010', '100', '111'],
      '3': ['110', '001', '010', '001', '110'],
      '4': ['101', '101', '111', '001', '001'],
      '5': ['111', '100', '110', '001', '110'],
      '6': ['011', '100', '111', '101', '111'],
      '7': ['111', '001', '010', '010', '010'],
      '8': ['111', '101', '111', '101', '111'],
      '9': ['111', '101', '111', '001', '110'],
      '-': ['000', '000', '111', '000', '000'],
      '.': ['000', '000', '000', '000', '010'],
      '!': ['010', '010', '010', '000', '010'],
      '?': ['110', '001', '010', '000', '010'],
      '/': ['001', '001', '010', '100', '100'],
      ':': ['000', '010', '000', '010', '000'],
      '_': ['000', '000', '000', '000', '111'],
      '+': ['000', '010', '111', '010', '000'],
      ' ': ['000', '000', '000', '000', '000'],
    };

    /**
     * Converts a string into a 5-row boolean bitmap array using FONT_3X5.
     */
    function textToBitmap(str) {
      const clean = (str || ' ').toUpperCase();
      const rows = [[], [], [], [], []];
      for (let i = 0; i < clean.length; i++) {
        const glyph = FONT_3X5[clean[i]] || FONT_3X5[' '];
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 3; c++) {
            rows[r].push(glyph[r][c] === '1');
          }
          if (i < clean.length - 1) rows[r].push(false); // 1-col letter spacing
        }
      }
      return rows;
    }

    // =========================================================================
    // 19 PROCEDURAL ASCII EFFECTS
    // =========================================================================

    const EFFECTS = [
      // 0. LIVE NAME STREAMER (FIRST CELL — TOP LEFT)
      {
        id: 'name-streamer',
        title: 'Name Streamer',
        tag: 'LIVE INPUT',
        cols: 36,
        rows: 13,
        fps: 20,
        interactive: false,
        hasNameInput: true,
        init(state) {
          state.text = 'KAI KLEINBARD';
        },
        description:
          'Type any name or phrase below to live-stream it into a 3×5 procedural ASCII bitmap with a traveling shimmer wave. Automatically wraps two words or marquee-scrolls longer text.',
        code: `// Live 3x5 bitmap rasterizer + traveling glyph wave
const bit = bitmap[row][col];
const wave = Math.sin(x * 0.35 - t * 5.2 + y * 0.4);
const glyph = bit
  ? (wave > 0.45 ? '@' : wave > -0.1 ? '#' : '+')
  : (bgRipple ? '·' : ' ');`,
        render(t, state, pointer, cols, rows) {
          const raw = (state.text || '').trim();
          const display = raw.length > 0 ? raw : 'TYPE NAME';
          const words = display.split(/\s+/);

          let lines = [display];
          if (words.length >= 2) {
            const mid = Math.ceil(words.length / 2);
            lines = [words.slice(0, mid).join(' '), words.slice(mid).join(' ')];
          }

          const bitmaps = lines.map((line) => textToBitmap(line));
          const totalHeight = bitmaps.length === 2 ? 11 : 5;
          const topPad = Math.floor((rows - totalHeight) / 2);
          const scrollTick = Math.floor(t * 10);

          let out = '';
          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              let lit = false;
              const relY = y - topPad;

              if (bitmaps.length === 1) {
                if (relY >= 0 && relY < 5) {
                  const bm = bitmaps[0];
                  const w = bm[0].length;
                  if (w <= cols) {
                    const leftPad = Math.floor((cols - w) / 2);
                    const bx = x - leftPad;
                    if (bx >= 0 && bx < w) lit = bm[relY][bx];
                  } else {
                    const padW = w + 6;
                    const bx = (x + scrollTick) % padW;
                    if (bx < w) lit = bm[relY][bx];
                  }
                }
              } else {
                const lineIdx = relY >= 0 && relY < 5 ? 0 : relY >= 6 && relY < 11 ? 1 : -1;
                if (lineIdx !== -1) {
                  const bm = bitmaps[lineIdx];
                  const bmRow = lineIdx === 0 ? relY : relY - 6;
                  const w = bm[0].length;
                  if (w <= cols) {
                    const leftPad = Math.floor((cols - w) / 2);
                    const bx = x - leftPad;
                    if (bx >= 0 && bx < w) lit = bm[bmRow][bx];
                  } else {
                    const padW = w + 6;

      // 2. DANCING GHOSTTY (SMOOTH 3D SPINNING & FLOATING MONOCHROME MASCOT)
      {

        code: `// Procedural 3D spinning & floating Ghostty mascot (monochrome)
const rotY = t * 1.15;
const floatY = Math.sin(t * 2.1) * 1.15;
// Capsule silhouette + 3-lobed wavy skirt + front ">_" cutout
const phi = Math.atan2(nx / width, nz) - rotY;
// Distance-field halo renders shimmering monochrome contour glyphs`,
        render(t, state, pointer, cols, rows) {
          const cx = (cols - 1) / 2;
          const cy = (rows - 1) / 2 + Math.sin(t * 2.1) * 1.15;
          const rx = cols * 0.29;
          const ry = rows * 0.37;
          const rotY = t * 1.15;
          const TWO_PI = Math.PI * 2;

          // Pass 1: Rasterize 3D ghost surface and recessed ">_" face
          const bodyMask = Array.from({ length: rows }, () => new Uint8Array(cols));
          const charGrid = Array.from({ length: rows }, () => Array(cols).fill(' '));
          const tierGrid = Array.from({ length: rows }, () => new Uint8Array(cols)); // 0=none, 1=lo, 2=md, 3=hi

          for (let y = 0; y < rows; y++) {
            const ny = (y - cy) / ry;
            if (ny < -1.02 || ny > 1.04) continue;

            // Dome head + straight torso profile
            let halfW = 0;
            if (ny < -0.18) {
              const dy = (ny + 0.18) / 0.82;
              const sq = 1 - dy * dy;
              if (sq <= 0) continue;
              halfW = Math.sqrt(sq);
            } else {
              halfW = 1.0 - Math.max(0, ny + 0.18) * 0.03;
            }

            for (let x = 0; x < cols; x++) {
              const nx = (x - cx) / rx;
              if (Math.abs(nx) > halfW) continue;

              const uNorm = nx / Math.max(0.001, halfW);
              const nz = Math.sqrt(Math.max(0, 1 - uNorm * uNorm));

              // Surface angle around vertical axis
              let phi = Math.atan2(uNorm, nz) - rotY;
              phi = ((phi + Math.PI) % TWO_PI + TWO_PI) % TWO_PI - Math.PI;

              // 3-lobed undulating skirt along the bottom edge
              const skirtBottom = 0.78 + 0.15 * Math.sin(phi * 3.0 + Math.sin(t * 2.2) * 0.45);
              if (ny > skirtBottom) continue;

              bodyMask[y][x] = 1;

              // Recessed Ghostty terminal face: ">" on left, "_" on right (front hemisphere)
              let isCutout = false;
              let isCutoutRim = false;
              if (Math.abs(phi) < 1.08 && ny > -0.36 && ny < 0.18) {
                // Left ">" chevron
                const inChevX = phi >= -0.72 && phi <= -0.18;
                const dUpper = Math.abs((ny - -0.09) - (phi - -0.18) * 0.46);
                const dLower = Math.abs((ny - -0.09) + (phi - -0.18) * 0.46);
                const chevDist = Math.min(
                  ny <= -0.09 ? dUpper : 9,
                  ny >= -0.09 ? dLower : 9
                );
                if (inChevX && chevDist < 0.072) isCutout = true;
                else if (inChevX && chevDist < 0.125) isCutoutRim = true;

                // Right "_" cursor bar
                const inBarX = phi >= 0.12 && phi <= 0.68;
                const inBarY = ny >= -0.06 && ny <= 0.075;
                const nearBar =
                  phi >= 0.06 && phi <= 0.74 && ny >= -0.12 && ny <= 0.13;
                if (inBarX && inBarY) isCutout = true;
                else if (nearBar) isCutoutRim = true;
              }

              if (isCutout) {
                charGrid[y][x] = ' ';
                tierGrid[y][x] = 0;
                continue;
              }

              // Smooth directional + curvature shading (pure monochrome)
              const light = nz * 0.78 + uNorm * 0.16 - ny * 0.12;
              const edgeDist = skirtBottom - ny;

              if (isCutoutRim) {
                charGrid[y][x] = nz > 0.6 ? '@' : '*';
                tierGrid[y][x] = 2;
              } else if (edgeDist < 0.085) {
                charGrid[y][x] = nz > 0.55 ? '%' : 'o';
                tierGrid[y][x] = 2;
              } else if (light > 0.68) {
                charGrid[y][x] = '$';
                tierGrid[y][x] = 3;
              } else if (light > 0.44) {
                charGrid[y][x] = '@';
                tierGrid[y][x] = 3;
              } else if (light > 0.25) {
                charGrid[y][x] = '%';
                tierGrid[y][x] = 2;
              } else if (light > 0.12) {
                charGrid[y][x] = 'o';
                tierGrid[y][x] = 2;
              } else {
                charGrid[y][x] = '~';
                tierGrid[y][x] = 1;
              }
            }
          }

          // Pass 2: Shimmering monochrome aura contour around the silhouette
          const auraChars = ['+', '=', '*', 'x', '+', '=', 'o'];
          const shimmerTick = t * 5.0;

          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              if (bodyMask[y][x]) continue;

              let minD2 = 999;
              for (let dy = -2; dy <= 2; dy++) {
                const sy = y + dy;
                if (sy < 0 || sy >= rows) continue;
                for (let dx = -4; dx <= 4; dx++) {
                  const sx = x + dx;
                  if (sx < 0 || sx >= cols) continue;
                  if (bodyMask[sy][sx]) {
                    // Aspect-ratio corrected squared distance
                    const d2 = (dx * 0.52) * (dx * 0.52) + dy * dy;
                    if (d2 < minD2) minD2 = d2;
                  }
                }
              }

              // Outer floating halo ring (strictly monochrome dim gray)
              if (minD2 >= 2.25 && minD2 <= 4.35) {
                const wave = Math.sin(x * 0.35 + y * 0.45 - shimmerTick);
                const idx = Math.floor(((wave + 1) * 0.5) * (auraChars.length - 1));
                charGrid[y][x] = auraChars[idx];
                tierGrid[y][x] = 1;
              }
            }
          }

          // Build batched monochrome HTML spans
          const lines = [];
          for (let y = 0; y < rows; y++) {
            let rowHtml = '';
            let curTier = 0;
            let chunk = '';
            const flush = () => {
              if (!chunk) return;
              const safe = escapeHtml(chunk);
              if (curTier === 3) rowHtml += `<span class="c-hi">${safe}</span>`;
              else if (curTier === 2) rowHtml += `<span class="c-md">${safe}</span>`;
              else if (curTier === 1) rowHtml += `<span class="c-lo">${safe}</span>`;
              else rowHtml += safe;
              chunk = '';
            };
            for (let x = 0; x < cols; x++) {
              const tVal = tierGrid[y][x];
              const ch = charGrid[y][x];
              if (tVal !== curTier) {
                flush();
                curTier = tVal;
              }
              chunk += ch;
            }
            flush();
            lines.push(rowHtml);
          }
          return lines.join('\n');
        },
      },

      // 5. DANCING 3D CUBE
      {
        id: 'dancing-cube',
        title: 'Dancing 3D Cube',
        tag: '3D Z-BUFFER',
        cols: 36,
        rows: 21,
        fps: 24,
        interactive: false,
        description:
          'A shaded 3D ASCII cube that bounces with rhythmic squash-and-stretch, tumbling through pitch, yaw, and roll with a software z-buffer and directional lighting.',
        code: `// 3D cube surface sampling + squash-and-stretch bounce
const bounce = Math.abs(Math.sin(t * 3.8));
const squashY = 0.85 + bounce * 0.3;
const squashXZ = 1 / Math.sqrt(squashY);
// Rotate (x,y,z) -> perspective project -> z-buffer shade`,
        render(t, state, pointer, cols, rows) {
          const zBuf = new Float32Array(cols * rows).fill(-1e9);
          const buf = Array(cols * rows).fill(' ');

          const A = t * 1.4;
          const B = t * 1.9;
          const C = t * 0.8;
          const bounce = Math.abs(Math.sin(t * 4.2));
          const squashY = 0.82 + bounce * 0.32;
          const squashXZ = 1 / Math.sqrt(squashY);
          const yLift = (bounce - 0.45) * 3.4;

          const sinA = Math.sin(A), cosA = Math.cos(A);
          const sinB = Math.sin(B), cosB = Math.cos(B);
          const sinC = Math.sin(C), cosC = Math.cos(C);

          const project = (ix, iy, iz, ch) => {
            const x0 = ix * squashXZ;
            const y0 = iy * squashY;
            const z0 = iz * squashXZ;

            const x1 = x0 * cosB + z0 * sinB;
            const z1 = -x0 * sinB + z0 * cosB;
            const y2 = y0 * cosA - z1 * sinA;
            const z2 = y0 * sinA + z1 * cosA;
            const x3 = x1 * cosC - y2 * sinC;
            const y3 = x1 * sinC + y2 * cosC;

            const dist = 28;
            const ooz = 1 / (z2 + dist);
            const xp = Math.floor(cols / 2 + x3 * ooz * 35);
            const yp = Math.floor(rows / 2 - (y3 + yLift) * ooz * 19);

            if (xp >= 0 && xp < cols && yp >= 0 && yp < rows) {
              const idx = yp * cols + xp;
              if (ooz > zBuf[idx]) {
                zBuf[idx] = ooz;
                buf[idx] = ch;
              }
            }
          };

          const size = 5.6;
          const step = 0.7;
          for (let u = -size; u <= size; u += step) {
            for (let v = -size; v <= size; v += step) {
              project(u, v, -size, '@');
              project(size, v, u, '#');
              project(-size, v, -u, '+');
              project(-u, v, size, '=');
              project(u, -size, -v, ':');
              project(u, size, v, '.');
            }
          }

          let out = '';
          for (let y = 0; y < rows; y++) {
            out += buf.slice(y * cols, (y + 1) * cols).join('');
            if (y < rows - 1) out += '\n';
          }
          return out;
        },
      },

        description:
          'Directional ASCII arrows (> < ^ v) steer via Craig Reynolds’ separation, alignment, and cohesion rules. Hover to attract the swarm toward your cursor.',
        code: `// Boids steering: separation + alignment + cohesion
b.vx += sepX * 0.08 + aliX * 0.05 + cohX * 0.01;
b.vy += sepY * 0.08 + aliY * 0.05 + cohY * 0.01;
// Pick directional glyph from atan2(vy, vx)`,
        render(t, state, pointer, cols, rows) {
          const boids = state.boids;
          const grid = Array.from({ length: rows }, () => Array(cols).fill(' '));

          for (let i = 0; i < boids.length; i++) {
            const b = boids[i];
            let sepX = 0, sepY = 0;
            let aliX = 0, aliY = 0;
            let cohX = 0, cohY = 0;
            let count = 0;

            for (let j = 0; j < boids.length; j++) {
              if (i === j) continue;
              const o = boids[j];
              const dx = o.x - b.x;
              const dy = o.y - b.y;
              const d = Math.hypot(dx * 0.6, dy);
              if (d < 6.5 && d > 0.01) {
                aliX += o.vx;
                aliY += o.vy;
                cohX += o.x;
                cohY += o.y;
                count++;
                if (d < 2.2) {
                  sepX -= dx / d;
                  sepY -= dy / d;
                }
              }
            }

            if (count > 0) {
              b.vx += (aliX / count - b.vx) * 0.06 + (cohX / count - b.x) * 0.006;
              b.vy += (aliY / count - b.vy) * 0.06 + (cohY / count - b.y) * 0.006;

            b.vy += sepY * 0.07;

              b.vx += (tx - b.x) * 0.012;
              b.vy += (ty - b.y) * 0.012;

            const speed = Math.hypot(b.vx, b.vy) || 0.01;
            const maxSpd = 0.72;
            const minSpd = 0.28;
            if (speed > maxSpd) {
              b.vx = (b.vx / speed) * maxSpd;
              b.vy = (b.vy / speed) * maxSpd;
            } else if (speed < minSpd) {
              b.vx = (b.vx / speed) * minSpd;
              b.vy = (b.vy / speed) * minSpd;

            b.y = (b.y + b.vy + rows) % rows;

            const gx = Math.floor(b.x);
            const gy = Math.floor(b.y);
            const ang = Math.atan2(b.vy, b.vx);
            let glyph = '>';
            if (ang > -Math.PI / 4 && ang <= Math.PI / 4) glyph = '>';
            else if (ang > Math.PI / 4 && ang <= (3 * Math.PI) / 4) glyph = 'v';
            else if (ang <= -Math.PI / 4 && ang > (-3 * Math.PI) / 4) glyph = '^';
            else glyph = '<';

            if (gy >= 0 && gy < rows && gx >= 0 && gx < cols) {
              grid[gy][gx] = glyph;
            }
          }

          return grid.map((r) => r.join('')).join('\n');
        },
      },

      // 18. SONAR SWEEP
      {
        id: 'sonar-sweep',
        title: 'Sonar Sweep',
        tag: 'RADAR BUFFER',
        cols: 36,
        rows: 17,
        fps: 22,
        interactive: false,
        init(state) {
          state.blips = [
            { r: 3.6, a: 0.7 },
            { r: 5.8, a: 2.4 },
            { r: 4.5, a: 4.2 },
            { r: 6.4, a: 5.3 },
          ];
        },
        description:
          'A sweeping monochrome radar beam rotates 360°, illuminating polar range rings and decaying phosphor target blips as the beam passes over them.',
        code: `// Polar radar sweep with angular trail decay
const diff = ((beamAngle - theta) % TWO_PI + TWO_PI) % TWO_PI;
const trail = diff < 1.15 ? 1 - diff / 1.15 : 0;
// Highlight target blips when beam passes overhead`,
        render(t, state, pointer, cols, rows) {
          const cx = (cols - 1) / 2;
          const cy = (rows - 1) / 2;
          const maxR = 7.4;
          const TWO_PI = Math.PI * 2;
          const beam = (t * 1.9) % TWO_PI;

          let out = '';
          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              const dx = (x - cx) * 0.54;
              const dy = y - cy;
              const r = Math.hypot(dx, dy);

              if (r > maxR + 0.35) {
                out += ' ';
                continue;
              }
              if (r > maxR - 0.35) {
                out += '·';
                continue;
              }

              const theta = (Math.atan2(dy, dx) + TWO_PI) % TWO_PI;
              const diff = (beam - theta + TWO_PI) % TWO_PI;

              // Check target blips
              let blipHit = false;
              for (let i = 0; i < state.blips.length; i++) {
                const b = state.blips[i];
                const bx = Math.cos(b.a) * b.r;
                const by = Math.sin(b.a) * b.r;
                if (Math.hypot(dx - bx, dy - by) < 0.65) {
                  const bDiff = (beam - b.a + TWO_PI) % TWO_PI;
                  if (bDiff < 2.2) {
                    out += bDiff < 0.6 ? '@' : '+';
                    blipHit = true;
                  }
                  break;
                }
              }
              if (blipHit) continue;

              if (r < 0.55) {
                out += '+';
              } else if (diff < 0.14) {
                out += '@';
              } else if (diff < 0.45) {
                out += '#';
              } else if (diff < 0.85) {
                out += ':';
              } else if (diff < 1.25) {
                out += '·';
              } else if (Math.abs(r - 3.7) < 0.22) {
                out += '.';
              } else {
                out += ' ';
              }
            }
            if (y < rows - 1) out += '\n';
          }
          return out;
        },
      },
    ];

    // =========================================================================
    // GALLERY ENGINE & DOM MOUNTING
    // =========================================================================

    let isPaused = false;
    const cellControllers = [];
    const mountedCards = [];
    let currentColCount = 0;

    function getMasonryColCount() {
      const w = window.innerWidth;
      if (w >= 1440) return 4;
      if (w >= 1024) return 3;
      if (w >= 640) return 2;
      return 1;
    }

    /**
     * Distributes mounted cards into flex masonry columns so that:
     * - Card 0 (Name Streamer) is always top-left (Column 0)
     * - Card 1 (CLICK ME LinkedIn) is always directly to its right (Column 1) on >=2 cols
     * - Remaining cards flow organically across columns to balance masonry heights
     */
    function layoutMasonry(force = false) {
      const grid = document.getElementById('masonry-grid');
      if (!grid || mountedCards.length === 0) return;

      const numCols = getMasonryColCount();
      if (!force && numCols === currentColCount) return;
      currentColCount = numCols;

      const cols = Array.from({ length: numCols }, () => {
        const colEl = document.createElement('div');
        colEl.className = 'masonry-col';
        return colEl;
      });
      const colHeights = new Array(numCols).fill(0);

      mountedCards.forEach((entry, idx) => {
        let targetCol = 0;
        if (idx === 0) {
          targetCol = 0;
        } else if (idx === 1 && numCols >= 2) {
          targetCol = 1;
        } else if (idx < numCols) {
          targetCol = idx;
        } else {
          // Pick shortest estimated column for organic masonry balance
          let minH = colHeights[0];
          targetCol = 0;
          for (let c = 1; c < numCols; c++) {
            if (colHeights[c] < minH) {
              minH = colHeights[c];
              targetCol = c;
            }
          }
        }
        cols[targetCol].appendChild(entry.card);
        colHeights[targetCol] += entry.estHeight;
      });

      grid.innerHTML = '';
      cols.forEach((colEl) => grid.appendChild(colEl));
    }

    function updateStatusReadout() {
      const el = document.getElementById('status-readout');
      if (!el) return;
      const total = EFFECTS.length;
      const activeCount = isPaused
        ? 0
        : cellControllers.filter((c) => !c.showingInfo).length;
      el.textContent = isPaused
        ? `PAUSED: 0 / ${total}`
        : `ACTIVE: ${activeCount} / ${total}`;
    }

    function mountGallery() {
      const grid = document.getElementById('masonry-grid');
      if (!grid) return;
      grid.innerHTML = '';
      mountedCards.length = 0;

      EFFECTS.forEach((effect) => {
        const card = document.createElement('article');
        card.className = 'masonry-item';
        card.dataset.id = effect.id;

        const state = {};
        if (typeof effect.init === 'function') {
          effect.init(state, effect.cols, effect.rows);
        }

        const pointer = { active: false, x: 0.5, y: 0.5 };

        // Top-right 'i' button
        const infoBtn = document.createElement('button');
        infoBtn.type = 'button';
        infoBtn.className = 'info-btn';
        infoBtn.setAttribute('aria-label', `Toggle info and code for ${effect.title}`);
        infoBtn.textContent = 'i';

        // Subtle top-left title label
        const headerBadge = document.createElement('div');
        headerBadge.className =
          'absolute top-2.5 left-3 z-10 flex items-center gap-2 pointer-events-none';
        headerBadge.innerHTML = `
          <span class="font-mono text-[10px] tracking-widest uppercase text-[var(--text-secondary)]">${escapeHtml(effect.title)}</span>
          <span class="font-mono text-[9px] px-1.5 py-0.5 rounded border border-[var(--border-subtle)] text-[var(--text-muted)]">${escapeHtml(effect.tag)}</span>
        `;

        // ASCII Stage
        const stage = document.createElement('div');
        stage.className = `ascii-stage${effect.interactive ? ' interactive-stage' : ''}${
          effect.clickableLink ? ' clickable-stage' : ''
        }`;

        const pre = document.createElement('pre');
        pre.className = 'ascii-pre';
        stage.appendChild(pre);

        // Clickable link launcher for clickableLink cells
        if (effect.clickableLink) {
          stage.setAttribute('role', 'link');
          stage.setAttribute('tabindex', '0');
          stage.setAttribute('title', 'Click to open link');

          const launchLink = () => {
            const val = (state.text || '').trim();
            if (!val) {
              showToast('Enter a link or text first');
              return;
            }
            const isFullUrl = /^https?:\/\//i.test(val);
            const looksLikeDomain = /^[\w-]+(\.[\w-]+)+([/?#].*)?$/i.test(val);
            if (isFullUrl || looksLikeDomain) {
              const targetUrl = isFullUrl ? val : `https://${val}`;
              window.open(targetUrl, '_blank', 'noopener,noreferrer');
              showToast(`Opening ${targetUrl}`);
            } else {
              copyTextToClipboard(val);
              showToast(`Clicked: "${val}" (copied)`);
            }
          };

          stage.addEventListener('click', launchLink);
          stage.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              launchLink();
            }
          });
        }

        // Info / Code Overlay Panel
        const infoPanel = document.createElement('div');
        infoPanel.className = 'info-panel';
        const inspLinkHtml = effect.inspirationUrl
          ? `<a href="${escapeHtml(effect.inspirationUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 mt-1.5 font-mono text-[10px] underline underline-offset-2 text-[var(--text-primary)] hover:opacity-80">INSPIRED BY ${escapeHtml(effect.inspirationLabel || effect.inspirationUrl)} ↗</a>`
          : '';
        infoPanel.innerHTML = `
          <div class="pr-8 mb-2.5">
            <div class="flex items-center gap-2 mb-1">
              <h2 class="font-mono text-xs font-semibold uppercase tracking-wider text-[var(--text-primary)]">${escapeHtml(effect.title)}</h2>
              <span class="font-mono text-[9px] px-1.5 py-0.5 rounded border border-[var(--border-subtle)] text-[var(--text-muted)]">${escapeHtml(effect.tag)}</span>
            </div>
            <p class="text-[11px] leading-relaxed text-[var(--text-secondary)]">${escapeHtml(effect.description)}</p>
            ${inspLinkHtml}
          </div>
          <div class="flex-1 min-h-0 flex flex-col border border-[var(--border-subtle)] rounded-lg bg-[var(--bg-page)] overflow-hidden">
            <div class="flex items-center justify-between px-2.5 py-1.5 border-b border-[var(--border-subtle)]">
              <span class="font-mono text-[10px] text-[var(--text-muted)]">ALGORITHM.JS</span>
              <button type="button" class="copy-code-btn font-mono text-[10px] px-2 py-0.5 rounded border border-[var(--border-subtle)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:border-[var(--text-primary)] transition-colors cursor-pointer">
                COPY
              </button>
            </div>
            <pre class="code-scroll flex-1 overflow-auto p-2.5 font-mono text-[10px] leading-relaxed text-[var(--text-primary)] m-0">${escapeHtml(effect.code)}</pre>
          </div>
        `;

        card.appendChild(headerBadge);
        card.appendChild(infoBtn);
        card.appendChild(stage);

        // Optional Minimalist Inspiration Attribution Bar
        if (effect.inspirationUrl) {
          const attrBar = document.createElement('div');
          attrBar.className = 'attribution-bar';
          attrBar.innerHTML = `
            <span class="font-mono text-[10px] tracking-widest uppercase text-[var(--text-muted)]">INSPIRATION</span>
            <a
              href="${escapeHtml(effect.inspirationUrl)}"
              target="_blank"
              rel="noopener noreferrer"
              class="attribution-link"
            >
              ${escapeHtml(effect.inspirationLabel || effect.inspirationUrl)} ↗
            </a>
          `;
          card.appendChild(attrBar);
        }

        // Optional Live Name Input Bar (for first cell)
        if (effect.hasNameInput) {
          const inputWrap = document.createElement('div');
          inputWrap.className = 'name-input-wrap';
          inputWrap.innerHTML = `
            <span class="font-mono text-[11px] text-[var(--text-muted)] select-none">&gt;_</span>
            <input
              type="text"
              class="name-input"
              value="${escapeHtml(state.text)}"
              maxlength="32"
              placeholder="TYPE YOUR NAME..."
              aria-label="Type your name to animate in ASCII"
              spellcheck="false"
              autocomplete="off"
            />
          `;
          const inputEl = inputWrap.querySelector('input');
          inputEl.addEventListener('input', (e) => {
            state.text = e.target.value;
          });
          card.appendChild(inputWrap);
        }

        // Optional Distinct Pill Link Input Bar (for CLICK ME cell)
        if (effect.hasLinkInput) {
          const linkWrap = document.createElement('div');
          linkWrap.className = 'link-input-wrap';
          linkWrap.innerHTML = `
            <div class="link-input-pill">
              <span class="font-mono text-[11px] text-[var(--text-secondary)] select-none">↗</span>
              <input
                type="text"
                class="link-input"
                value="${escapeHtml(state.text)}"
                maxlength="120"
                placeholder="Paste any URL or text..."
                aria-label="Enter any URL or text to make the animation clickable"
                spellcheck="false"
                autocomplete="off"
              />
            </div>
          `;
          const linkInputEl = linkWrap.querySelector('input');
          linkInputEl.addEventListener('input', (e) => {
            state.text = e.target.value;
          });
          card.appendChild(linkWrap);
        }

        card.appendChild(infoPanel);
        const estHeight =
          effect.rows + (effect.hasNameInput || effect.hasLinkInput || effect.inspirationUrl ? 4 : 0);
        mountedCards.push({ card, estHeight });

        // Controller object for animation loop
        const controller = {
          effect,
          state,
          pointer,
          pre,
          lastFrame: 0,
          showingInfo: false,
        };
        cellControllers.push(controller);

        // Toggle 'i' Info / Code Panel
        infoBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          controller.showingInfo = !controller.showingInfo;
          card.classList.toggle('show-info', controller.showingInfo);
          infoBtn.textContent = controller.showingInfo ? '×' : 'i';
          updateStatusReadout();
        });

        // Copy snippet button
        const copyBtn = infoPanel.querySelector('.copy-code-btn');
        if (copyBtn) {
          copyBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            copyTextToClipboard(effect.code);
          });
        }

        // Interactive pointer events (mouse + touch)
        if (effect.interactive) {
          const updatePointer = (clientX, clientY) => {
            const rect = stage.getBoundingClientRect();
            pointer.x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            pointer.y = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
            pointer.active = true;
          };

          stage.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
          stage.addEventListener('mouseleave', () => {
            pointer.active = false;
          });
          stage.addEventListener(
            'touchstart',
            (e) => {
              if (e.touches.length > 0) {
                updatePointer(e.touches[0].clientX, e.touches[0].clientY);
              }
            },
            { passive: true }
          );
          stage.addEventListener(
            'touchmove',
            (e) => {
              if (e.touches.length > 0) {
                e.preventDefault();
                updatePointer(e.touches[0].clientX, e.touches[0].clientY);
              }
            },
            { passive: false }
          );
          stage.addEventListener('touchend', () => {
            pointer.active = false;
          });
        }
      });

      layoutMasonry(true);
      updateStatusReadout();
    }

    // =========================================================================
    // MAIN ANIMATION LOOP
    // =========================================================================

    let startTime = 0;

    function animate(now) {
      if (!startTime) startTime = now;
      const elapsedSec = (now - startTime) * 0.001;

      if (!isPaused) {
        for (let i = 0; i < cellControllers.length; i++) {
          const c = cellControllers[i];
          if (c.showingInfo) continue;

          const frameInterval = 1000 / c.effect.fps;
          if (now - c.lastFrame >= frameInterval) {
            c.lastFrame = now;
            try {
              const output = c.effect.render(
                elapsedSec,
                c.state,
                c.pointer,
                c.effect.cols,
                c.effect.rows
              );
              c.pre.innerHTML = c.effect.isHtml ? output : shadeAscii(output);
            } catch (err) {
              c.pre.textContent = '[RENDER ERROR]';
            }
          }
        }
      }

      requestAnimationFrame(animate);
    }

    // =========================================================================
    // HEADER CONTROLS & BOOTSTRAP
    // =========================================================================

    window.onload = function () {
      mountGallery();
      window.addEventListener('resize', () => layoutMasonry(false));

      const btnPause = document.getElementById('btn-pause');
      const pauseIcon = document.getElementById('pause-icon');
      const pauseLabel = document.getElementById('pause-label');

      if (btnPause) {
        btnPause.addEventListener('click', () => {
          isPaused = !isPaused;
          pauseIcon.textContent = isPaused ? '▶' : '❚❚';
          pauseLabel.textContent = isPaused ? 'PLAY' : 'PAUSE';
          updateStatusReadout();
        });
      }

      const btnTheme = document.getElementById('btn-theme');
      if (btnTheme) {
        btnTheme.addEventListener('click', () => {
          document.documentElement.classList.toggle('light-mono');
        });
      }

      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
